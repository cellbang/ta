# The release of a tag vX.Y.Z, with the notes of releases/vX.Y.Z.md, which the release of Ta pushes here
# (scripts/publish-ta-release.ts of its repository).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 && exit 0
          gh release create "$TAG" --verify-tag --title "Ta ${TAG#v}" --notes-file "releases/$TAG.md"
